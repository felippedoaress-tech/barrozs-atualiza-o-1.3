<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borroz FC 26 — Ultimate Arcade Edition</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #111827;
      --card-2: #0b1120;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --gold: #f59e0b;
      --danger: #ef4444;
      --purple: #a855f7;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #111c33 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand span { color: var(--accent); }
    .brand small {
      background: var(--accent);
      color: #052e16;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn:hover { border-color: var(--accent); }
    .tab-btn.active {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    .user-hud {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .coin-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 4px 12px 4px 6px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .profile-pill:hover { border-color: var(--accent-2); }

    .avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-2), var(--purple));
      display: grid;
      place-items: center;
      font-size: 1.1rem;
    }

    .profile-pill span { font-weight: 700; font-size: 0.85rem; }

    main {
      flex: 1;
      max-width: 980px;
      width: 100%;
      margin: 20px auto;
      padding: 0 16px;
    }

    .panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      animation: fadeIn 0.25s ease;
    }

    .panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      text-align: center;
      padding: 28px 16px;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.12), rgba(56, 189, 248, 0.08));
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 22px;
    }

    .hero h1 { font-size: 2.3rem; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); max-width: 580px; margin: 0 auto 20px; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .mode-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mode-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .mode-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .mode-card p { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; }

    .btn {
      background: var(--accent);
      color: #052e16;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn.blue { background: var(--accent-2); color: #082f49; }
    .btn.gold { background: var(--gold); color: #271500; }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* MERCADO & CARTÕES */
    .squad-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .ovr-badge {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #1f1100;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 1.05rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .fc-card {
      border-radius: 12px;
      padding: 12px;
      position: relative;
      border: 2px solid rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }
    .fc-card:hover { transform: translateY(-3px); }
    .fc-card.gold-rare { background: linear-gradient(160deg, #422006 0%, #1c1917 65%, #78350f 100%); border-color: #f59e0b; }
    .fc-card.icon-card { background: linear-gradient(160deg, #f8fafc 0%, #cbd5e1 60%, #fde68a 100%); color: #0f172a; border-color: #fbbf24; }
    .fc-card.toty-card { background: linear-gradient(160deg, #1e3a8a 0%, #090d16 65%, #2563eb 100%); border-color: #38bdf8; }

    .fc-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .fc-ovr { font-size: 1.45rem; font-weight: 900; line-height: 1; }
    .fc-pos { font-size: 0.72rem; font-weight: 800; opacity: 0.85; }
    .fc-face { font-size: 2.2rem; text-align: center; margin: 6px 0; }
    .fc-name { font-weight: 900; font-size: 0.92rem; text-align: center; text-transform: uppercase; border-bottom: 1px solid rgba(148, 163, 184, 0.3); padding-bottom: 4px; margin-bottom: 6px; }
    .fc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; }
    .fc-card .btn { width: 100%; padding: 6px; font-size: 0.78rem; }

    /* ESTÁDIO & JOGO 2D */
    .match-hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      gap: 10px;
    }

    .scoreboard { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 1.2rem; }
    .score-box { background: var(--accent); color: #052e16; padding: 2px 10px; border-radius: 6px; }

    #pitch-canvas {
      display: block;
      width: 100%;
      max-width: 820px;
      height: auto;
      margin: 0 auto;
      background: #15803d;
      border: 3px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .controls-guide {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .key-tag { background: var(--card-2); border: 1px solid var(--border); color: var(--text); padding: 2px 7px; border-radius: 5px; font-weight: 800; }

    .touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 12px;
    }
    .dpad-fc { display: grid; grid-template-columns: repeat(3, 46px); gap: 5px; }
    .dpad-fc button, .action-btns button { height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-2); color: var(--text); font-weight: 800; cursor: pointer; user-select: none; }
    .action-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .action-btns button { padding: 0 14px; font-size: 0.8rem; }

    /* MODO CARREIRA & HISTÓRIA */
    .story-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .story-box h3 { color: var(--accent); margin-bottom: 8px; font-size: 1.2rem; }
    .story-box p { color: var(--muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 14px; }

    #airplane
